# Builds Store once, deploys the same package to store-1 and store-2 IIS sites.
# Production appsettings / STORE_VOUCHER must already differ per site on the server.
trigger:
- main

variables:
- group: New variable group 26-Feb   # DEPLOY_USER + DEPLOY_PASSWORD

- name: buildConfiguration
  value: 'Release'

- name: publishFolder
  value: '$(Build.ArtifactStagingDirectory)\publish'

- name: zipFile
  value: '$(Build.ArtifactStagingDirectory)\package.zip'

- name: webProject
  value: 'deltanium-store.csproj'

stages:

- stage: Build
  displayName: Build
  jobs:
  - job: BuildJob
    pool:
      vmImage: 'windows-latest'
    steps:
    - checkout: self

    - task: UseDotNet@2
      displayName: Install .NET 8 SDK
      inputs:
        packageType: sdk
        version: 8.x

    - powershell: |
        if (Test-Path "$(publishFolder)") {
            Remove-Item "$(publishFolder)" -Recurse -Force
        }
      displayName: Clean publish folder

    - task: DotNetCoreCLI@2
      displayName: Restore
      inputs:
        command: restore
        projects: '$(webProject)'

    - task: DotNetCoreCLI@2
      displayName: Publish
      inputs:
        command: publish
        projects: '$(webProject)'
        arguments: '--configuration $(buildConfiguration) --output "$(publishFolder)"'
        zipAfterPublish: false
        modifyOutputPath: false

    - powershell: |
        Write-Host "===== PUBLISH FOLDER STRUCTURE ====="
        Get-ChildItem "$(publishFolder)"
      displayName: Verify publish output

    - task: ArchiveFiles@2
      displayName: Create package.zip
      inputs:
        rootFolderOrFile: '$(publishFolder)'
        includeRootFolder: false
        archiveType: zip
        archiveFile: '$(zipFile)'
        replaceExistingArchive: true

    - publish: $(zipFile)
      artifact: drop

- stage: Deploy
  displayName: Deploy to IIS (store-1 + store-2)
  dependsOn: Build
  jobs:
  - job: DeployJob
    pool:
      vmImage: 'windows-latest'
    steps:
    - download: current
      artifact: drop

    - task: PowerShell@2
      displayName: MSDeploy store-1.deltanium.com
      inputs:
        targetType: inline
        script: |
          $ErrorActionPreference = "Stop"
          $msdeploy = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          $site = "store-1.deltanium.com"

          $arguments = @(
            "-verb:sync",
            "-source:package=$(Pipeline.Workspace)\drop\package.zip",
            "-dest:contentPath=$site,computerName=https://103.179.190.130:8172/msdeploy.axd?site=$site,userName=$(DEPLOY_USER),password=$(DEPLOY_PASSWORD),authType=Basic",
            "-enableRule:AppOffline",
            "-allowUntrusted"
          )

          & $msdeploy $arguments
          if ($LASTEXITCODE -ne 0) { throw "MSDeploy failed for $site exit=$LASTEXITCODE" }
          Write-Host "OK: $site"

    - task: PowerShell@2
      displayName: MSDeploy store-2.deltanium.com
      inputs:
        targetType: inline
        script: |
          $ErrorActionPreference = "Stop"
          $msdeploy = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          $site = "store-2.deltanium.com"

          $arguments = @(
            "-verb:sync",
            "-source:package=$(Pipeline.Workspace)\drop\package.zip",
            "-dest:contentPath=$site,computerName=https://103.179.190.130:8172/msdeploy.axd?site=$site,userName=$(DEPLOY_USER),password=$(DEPLOY_PASSWORD),authType=Basic",
            "-enableRule:AppOffline",
            "-allowUntrusted"
          )

          & $msdeploy $arguments
          if ($LASTEXITCODE -ne 0) { throw "MSDeploy failed for $site exit=$LASTEXITCODE" }
          Write-Host "OK: $site"
